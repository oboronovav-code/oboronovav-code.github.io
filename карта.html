<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта моніторингу - Система IoT</title>
    <link rel="stylesheet" href="головна1.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <header id="main-header">
        <div class="menu-icon">☰</div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html" class="btn-nav">Головна</a></li>
                <li><a href="#" class="btn-nav">Карта</a></li>
                <li><a href="авторизація.html" class="btn-nav">Увійти/Реєстрація</a></li>
            </ul>
        </nav>
    </header>

    <div class="map-page-wrapper">
        <aside class="map-sidebar">
            <div class="custom-dropdown">
                <select id="district-select" class="side-btn" onchange="filterDistrict(this.value)">
                    <option value="all" selected>Увесь Київ (Усі райони)</option>
                    <option value="solomianskyi">Солом'янський район</option>
                    <option value="shevchenkivskyi">Шевченківський район</option>
                    <option value="shevchenkivskyi">Дарницький район</option>
                    <option value="shevchenkivskyi">Святошинський район</option>
                    <option value="shevchenkivskyi">Подільський район</option>
                    <option value="shevchenkivskyi">Печерський район</option>
                    <option value="shevchenkivskyi">Оболонський район</option>
                    <option value="shevchenkivskyi">Голосіївський район</option>
                    <option value="shevchenkivskyi">Деснянський район</option>
                    <option value="shevchenkivskyi">Дніпровський район</option>
                </select>
            </div>
            
            <div class="custom-dropdown" id="priority-dropdown">
                <div class="dropdown-header" onclick="toggleDropdown()">
                    <span>Пріоритетні точки</span>
                    <span class="arrow">▾</span>
                </div>
                <div class="dropdown-list" id="priority-list">
                    </div>
            </div>
        
            <div class="report-dropdown">
                <button type="button" id="report-btn" class="side-btn report-btn" onclick="toggleReportForm()" style="display: none;">
                    Створити звіт ▾
                </button>
                
                <div id="report-form-container" class="report-form-content">
                    <label>Період:</label>
                    <select id="report-period">
                        <option value="day">За день</option>
                        <option value="week">За тиждень</option>
                    </select>
            
                    <label>Станція:</label>
                    <input type="text" id="report-station" placeholder="Назва станції">
            
                    <button type="button" class="save-report-btn" onclick="saveReport()">Зберегти</button>
                </div>
            </div>
            <button class="side-btn report-btn">Переглянути звіт</button>
        </aside>
        <main class="map-display">
            <div id="map" style="width: 100%; height: 600px; border-radius: 10px;"></div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js-карта.js"></script>

</body>
</html>
